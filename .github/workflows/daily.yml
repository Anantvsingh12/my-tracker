name: Daily update

on:
  schedule:
    # GitHub uses UTC. 12:30 UTC = 18:00 IST, Monday to Friday, after the NSE close.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:      # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and build docs/market.json
        run: python scripts/update.py --quiet
      - name: Save the new data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/market.json
          git diff --cached --quiet || git commit -m "Daily data update"
          git push
